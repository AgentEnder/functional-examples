name: PR Workflow

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    name: Build and Test (${{ matrix.os }})

    env:
      NX_CI_EXECUTION_ENV: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup dev tools with mise
        uses: jdx/mise-action@v2
        if: matrix.os == 'ubuntu-latest'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print Task Graph
        run: npx nx run-many -t build test lint --graph stdout

      - name: Run tasks
        run: npx nx run-many -t build test lint

      - run: npx nx fix-ci
        if: always() && matrix.os == 'ubuntu-latest'

  deploy-preview:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs preview
        run: npx nx build docs-site
        env:
          PREVIEW_PATH: pr/${{ github.event.pull_request.number }}
          BASE_URL: /functional-examples/pr/${{ github.event.pull_request.number }}

      - name: Deploy preview to gh-pages
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          PREVIEW_DIR="pr/${PR_NUMBER}"

          git clone --branch gh-pages --single-branch --depth 1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages-repo

          rm -rf "gh-pages-repo/${PREVIEW_DIR}"
          mkdir -p "gh-pages-repo/${PREVIEW_DIR}"
          cp -r docs-site/dist/client/* "gh-pages-repo/${PREVIEW_DIR}/"

          cd gh-pages-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy docs preview for PR #${PR_NUMBER}" --allow-empty
          git push origin gh-pages

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            const shortSha = sha.slice(0, 7);
            const previewUrl = `https://agentender.github.io/functional-examples/pr/${prNumber}/`;
            const marker = '<!-- docs-preview-comment -->';
            const body = `${marker}\n**Docs Preview:** ${previewUrl}\n\nDeployed commit: ${shortSha} (${sha})`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
