name: Main Workflow

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup dev tools with mise
        uses: jdx/mise-action@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tasks
        run: npx nx run-many -t build test lint
        env:
          NX_VERBOSE_LOGGING: ${{ github.run_attempt == '1' && 'false' || 'true'}}

      - name: Fix CI
        run: npx -y nx@latest fix-ci
        if: always()
