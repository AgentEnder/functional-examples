<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    .brace { stroke: #e8edf4; }
    .check { stroke: #6cb4e0; }
    @media (prefers-color-scheme: light) {
      .brace { stroke: #1e3a5f; }
      .check { stroke: #2a6fa8; }
    }
  </style>

  <!-- Opening curly brace { — tips right, midpoint left -->
  <path class="brace" d="M 12 3
           C 8 3, 6 5, 6 9
           L 6 12.5
           C 6 14, 4.5 15.5, 2 16
           C 4.5 16.5, 6 18, 6 19.5
           L 6 23
           C 6 27, 8 29, 12 29"
        fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Closing curly brace } — tips left, midpoint right -->
  <path class="brace" d="M 20 3
           C 24 3, 26 5, 26 9
           L 26 12.5
           C 26 14, 27.5 15.5, 30 16
           C 27.5 16.5, 26 18, 26 19.5
           L 26 23
           C 26 27, 24 29, 20 29"
        fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Checkmark ✓ -->
  <polyline class="check" points="11,17 14.5,21 21,11"
            fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
