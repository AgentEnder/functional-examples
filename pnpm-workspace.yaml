packages:
  - 'packages/*'
  - 'examples/*'
  - 'docs-site'
  - 'e2e'
catalog:
  '@cli-forge/parser': '1.7.1'
  '@nx/devkit': '22.4.3'
  '@nx/eslint': '22.6.3'
  '@nx/eslint-plugin': '22.6.3'
  '@nx/js': '22.6.3'
  '@nx/vite': '22.4.3'
  '@nx/vitest': '22.6.3'
  '@nx/web': '22.4.3'
  '@nx/workspace': '22.6.3'
  '@swc-node/register': '~1.11.1'
  '@swc/core': '~1.15.3'
  '@swc/helpers': '~0.5.17'
  '@types/node': '22.19.8'
  '@typescript-eslint/eslint-plugin': '^8.58.0'
  '@typescript-eslint/parser': '^8.58.0'
  '@vitest/coverage-v8': '^4.1.2'
  cli-forge: '1.7.1'
  eslint: '^10.1.0'
  eslint-config-prettier: '10.1.8'
  eta: '^3.5.0'
  json5: '^2.2.3'
  jsonc-parser: '^3.3.1'
  nx: '22.6.3'
  picomatch: '^4.0.4'
  prettier: '^2.8.8'
  shiki: '^3.21.0'
  tinyglobby: '^0.2.15'
  tslib: '^2.3.0'
  tsx: '^4.7.0'
  typedoc: '^0.28.5'
  typescript: '^5.7.2'
  vite: '^8.0.3'
  vitest: '^4.1.2'
  yaml: '^2.8.3'
  tap-parser: '^3.0.5'
  zod: '4.3.6'
overrides:
  # axios <=1.13.4 has DoS via __proto__ key in mergeConfig (GHSA high)
  # nx 22.6.3 (latest) transitively depends on axios 1.13.4; no newer nx available
  axios: '>=1.14.0'
  # flatted <=3.3.3 has unbounded recursion DoS and prototype pollution (GHSA high)
  # eslint 10 → file-entry-cache 8 → flat-cache 4.0.1 → flatted ^3.2.9
  # Semver allows 3.4.2 but lockfile pins 3.3.3; override forces resolution
  flatted: '>=3.4.2'
  # minimatch 9.0.0–9.0.6 has multiple ReDoS vulnerabilities (GHSA high)
  # nx-github-pages 1.2.0 (latest) → @nx/devkit 21.4.1 → minimatch 9.0.3
  # Capped at <10 to avoid major version breakage with brace-expansion 5.x
  'minimatch@>=9.0.0 <10.0.0': '>=9.0.9 <10.0.0'
  # picomatch <4.0.4 has method injection and ReDoS (GHSA high + moderate)
  # @nx/js 22.6.3 (latest) directly depends on picomatch 4.0.2
  picomatch: '>=4.0.4'
  # yaml 1.x has stack overflow via deeply nested collections (GHSA moderate)
  # @nx/js → babel-plugin-macros → cosmiconfig → yaml 1.10.2
  # Cannot override yaml 1.x to 2.x (incompatible API); accept this moderate vuln
  # yaml: scoped to 2.x only
  'yaml@>=2.0.0': '>=2.8.3'
onlyBuiltDependencies:
  - 'nx'
