id: region-markers
title: Region Markers
description: |
  Demonstrates how to use region markers to tag sections
  of code for selective extraction in documentation.
tags:
  - regions
  - documentation
include:
  - "src/**/*.ts"
  - "*.json"
docs:
  skip: true
test:
  - name: typechecks pass
    options:
      command: npx tsc --noEmit -p tsconfig.json
    assertions:
      exitCode: 0
