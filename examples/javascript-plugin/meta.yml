id: javascript-plugin
title: JavaScript Plugin
description: |
  Demonstrates using frontmatter comments in TypeScript/JavaScript files
  to define example metadata, including region markers for code snippets.
tags:
  - plugin
  - frontmatter
  - typescript
  - regions
include:
  - "*.ts"
  - "*.sh"
  - "src/**/*"
  - "README.md"
  - "package.json"
test:
  - name: typechecks pass
    options:
      command: npx tsc --noEmit -p tsconfig.json
    assertions:
      exitCode: 0
  - name: CLI scan works
    options:
      command: bash demo.sh
    assertions:
      exitCode: 0
      stdout:
        contains: getting-started
