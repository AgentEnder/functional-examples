id: test-plugin-example
title: Test Plugin Example
description: |
  Demonstrates the test plugin with command execution and assertions.
  Tests verify script behavior including exit codes and output content.
entryPoint: hello.js
tags:
  - testing
  - assertions
  - commands
include:
  - "*.js"
  - "*.sh"
  - "*.json"
  - "README.md"
test:
  - name: runs hello script
    options:
      command: node hello.js
    assertions:
      exitCode: 0
      stdout:
        contains: Hello from example
  - name: fails with bad args
    options:
      command: node hello.js --fail
    assertions:
      exitCode: 1
      stderr:
        contains: Error
