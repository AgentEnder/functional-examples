id: multi-plugin-config
title: Multi-Plugin Configuration
description: |
  Shows how to configure multiple plugins together in a single config file.
tags:
  - configuration
  - plugins
include:
  - "*.ts"
  - "*.json"
docs:
  skip: true
test:
  - name: typechecks pass
    options:
      command: npx tsc --noEmit -p tsconfig.json
    assertions:
      exitCode: 0
  - name: lint passes
    options:
      command: npx eslint .
    assertions:
      exitCode: 0
