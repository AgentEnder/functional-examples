id: custom-extractor
title: Custom Extractor
description: |
  Demonstrates creating a custom Extractor implementation to support
  alternative metadata formats like TOML. Advanced usage requiring
  a TypeScript config with inline plugin code.
tags:
  - custom
  - extractor
  - toml
  - advanced
include:
  - "*.ts"
  - "*.sh"
  - "examples/**/*"
  - "README.md"
  - "package.json"
test:
  - name: typechecks pass
    options:
      command: npx tsc --noEmit -p tsconfig.json
    assertions:
      exitCode: 0
  - name: lint passes
    options:
      command: npx eslint .
    assertions:
      exitCode: 0
  - name: custom scan works
    options:
      command: npx tsx scan.ts
    assertions:
      exitCode: 0
      stdout:
        contains: hello-toml
