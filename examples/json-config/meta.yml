id: json-config
title: JSON Configuration
description: >
  Shows how to use a JSON configuration file for declarative setup.
  JSON configs support auto-detected plugins, scan patterns, path mappings,
  and metadata validation via JSON Schema.
tags:
  - configuration
  - json
  - schema-validation
include:
  - "*.json"
  - "*.sh"
  - "snippets/**/*"
  - "README.md"
  - "package.json"
test:
  - name: CLI scan works
    options:
      command: bash demo.sh
    assertions:
      exitCode: 0
