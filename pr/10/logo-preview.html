<!DOCTYPE html>
<html>
<head><title>Logo Preview</title></head>
<body style="background:#111827;padding:40px;font-family:sans-serif;color:white">
  <h2>Full logo (hero / nav)</h2>
  <div style="display:flex;align-items:end;gap:32px;margin:24px 0">
    <div style="text-align:center">
      <img src="logo.svg" width="28" height="28"><br><small>28px (nav)</small>
    </div>
    <div style="text-align:center">
      <img src="logo.svg" width="48" height="48"><br><small>48px</small>
    </div>
    <div style="text-align:center">
      <img src="logo.svg" width="80" height="80"><br><small>80px (hero)</small>
    </div>
    <div style="text-align:center">
      <img src="logo.svg" width="128" height="128"><br><small>128px</small>
    </div>
  </div>

  <h2 style="margin-top:40px">Favicon (no background, thicker strokes)</h2>
  <div style="display:flex;align-items:end;gap:32px;margin:24px 0">
    <div style="text-align:center">
      <img src="favicon.svg" width="16" height="16"><br><small>16px</small>
    </div>
    <div style="text-align:center">
      <img src="favicon.svg" width="24" height="24"><br><small>24px</small>
    </div>
    <div style="text-align:center">
      <img src="favicon.svg" width="32" height="32"><br><small>32px</small>
    </div>
    <div style="text-align:center">
      <img src="favicon.svg" width="48" height="48"><br><small>48px</small>
    </div>
    <div style="text-align:center">
      <img src="favicon.svg" width="64" height="64"><br><small>64px</small>
    </div>
  </div>

  <h2 style="margin-top:40px">Favicon on light background</h2>
  <div style="background:white;padding:24px;border-radius:8px;display:flex;align-items:end;gap:32px">
    <div style="text-align:center;color:#333">
      <img src="favicon.svg" width="16" height="16"><br><small>16px</small>
    </div>
    <div style="text-align:center;color:#333">
      <img src="favicon.svg" width="32" height="32"><br><small>32px</small>
    </div>
    <div style="text-align:center;color:#333">
      <img src="favicon.svg" width="64" height="64"><br><small>64px</small>
    </div>
  </div>
</body>
</html>
